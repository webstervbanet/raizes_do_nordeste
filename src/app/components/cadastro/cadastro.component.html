<div class="login-container">
  <!-- Header com logo -->
  <header class="header">
    <div class="logo-section">
      <div class="logo">
        <svg
          lucideCookingPot
          [size]="48"
          color="#003e1f"
          [strokeWidth]="2"
          title="Raizes do Nordeste"
        ></svg>
      </div>
    </div>
  </header>

  <!-- Área principal de cadastro -->
  <div class="login-main">
    <div class="login-box">
      <h1 class="login-title">Raízes do Nordeste</h1>
      <p class="login-subtitle">Crie sua conta</p>

      <!-- Mensagem de erro -->
      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <!-- Mensagem de sucesso -->
      @if (successMessage) {
        <div class="success-message">{{ successMessage }}</div>
      }

      <form (ngSubmit)="onLogin($event)" #loginForm="ngForm" class="login-form">
        <app-input
          label="Usuário"
          type="text"
          [(ngModel)]="nome_usuario"
          name="username"
          placeholder="usuario"
        />

        <app-input
          label="E-mail"
          type="email"
          [(ngModel)]="email_usuario"
          name="email"
          placeholder="exemplo@teste.com"
        />

        <app-input
          label="Senha"
          type="password"
          [(ngModel)]="senha_usuario"
          name="password"
          placeholder="•••••••"
        />

        <app-input
          label="Confirmar Senha"
          type="password"
          [(ngModel)]="senha_usuario"
          name="password"
          placeholder="•••••••"
        />

        <div class="container-endereco">
          <h6>Endereço</h6>
          <app-input label="CEP" type="text" name="cep" placeholder="Digite seu CEP" />
          <app-input label="Rua" type="text" name="rua" placeholder="Digite sua rua" />
          <app-input label="Número" type="text" name="numero" placeholder="Digite o número" />
          <app-input label="Bairro" type="text" name="bairro" placeholder="Digite o bairro" />
          <app-input label="Cidade" type="text" name="cidade" placeholder="Digite a cidade" />
          <app-input label="Estado" type="text" name="estado" placeholder="Digite o estado" />
        </div>

        <button
          type="submit"
          class="login-btn"
          [disabled]="isLoading || isSuccess || !loginForm.form.valid"
          [class.loading]="isLoading"
          [class.success]="isSuccess"
        >
          <span *ngIf="!isLoading && !isSuccess">Cadastrar</span>

          <span *ngIf="isLoading && !isSuccess">
            <span class="spinner"></span>
            Cadastrando...
          </span>
          <span *ngIf="isSuccess">
            <span class="success-icon"></span>
            Sucesso!
          </span>
        </button>

        <div>
          <p class="terms-text">
            <app-checkbox id="aceitacao" size="large" />
            Ao se cadastrar você concorda com nossos <a routerLink="/termos">Termos de Uso</a> e com
            a coleta de dados conforme
            <a routerLink="/politica-privacidade">Política de Privacidade</a> e LGPD.
          </p>
        </div>

        <div>
          <p>Já possuí uma conta? <a routerLink="/login">Acesse aqui</a></p>
        </div>
      </form>
    </div>
  </div>
</div>

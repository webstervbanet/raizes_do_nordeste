<div class="login-container">
  <!-- Header com logo -->
  <header class="header">
    <div class="logo-section">
      <div class="logo">
        <svg
          lucideCookingPot
          [size]="48"
          color="#003e1f"
          [strokeWidth]="2"
          title="Raizes do Nordeste"
        ></svg>
      </div>
    </div>
  </header>

  <!-- Área principal de login -->
  <div class="login-main">
    <div class="login-box">
      <h1 class="login-title">Raízes do Nordeste</h1>
      <p class="login-subtitle">Faça login para continuar</p>

      <form [formGroup]="form" class="login-form">
        <app-input
          label="E-mail"
          type="email"
          name="email"
          placeholder="exemplo@teste.com"
          formControlName="email"
          [invalid]="form.get('email')?.invalid && form.get('email')?.touched"
          [errorMessage]="'Campo Obrigatório'"
        />

        <app-input
          label="Senha"
          type="password"
          name="password"
          placeholder="•••••••"
          formControlName="password"
          [invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          [errorMessage]="'Campo Obrigatório'"
        />

        <button
          type="submit"
          class="login-btn"
          (click)="onLogin()"
          [disabled]="isLoading"
          [class.loading]="isLoading"
        >
          <span *ngIf="!isLoading">Acessar</span>

          <span *ngIf="isLoading">
            <span class="spinner"></span>
            Entrando...
          </span>
        </button>

        <div>
          <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
        </div>
      </form>
    </div>
  </div>
</div>

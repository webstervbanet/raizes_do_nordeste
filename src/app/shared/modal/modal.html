<p-dialog
  header="{{ title }}"
  [(visible)]="showModal"
  [modal]="true"
  [dismissableMask]="true"
  [closable]="true"
  [style]="{ width: '100%', maxWidth: `${width}px` }"
  (onHide)="fecharModal()"
  draggable="false"
  [focusOnShow]="false"
>
  @if (loadingModal) {
    <div class="loading-container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-loader-circle-icon lucide-loader-circle loading-spinner"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
    </div>
  } @else {
    <ng-content></ng-content>
  }

  <ng-template pTemplate="footer">
    <ng-content select="[modal-footer]"></ng-content>
  </ng-template>
</p-dialog>
